<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="./images/profile_picture.jpg" alt="Profile Picture" class="profile-picture">
            <div class="header-text">
                <h1>Akil Jules</h1>
                <p class="subtitle">Senior Web Software Engineer</p>
                <a href="https://www.linkedin.com/in/akiljules/" target="_blank" rel="noopener noreferrer" class="linkedin-link">
                    <svg class="linkedin-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                </a>
            </div>
            <div class="header-right">
                <span class="project-showcase">Project Showcase</span>
            </div>
        </header>
        
        <main class="bento-grid" id="portfolio-grid">
            <!-- Cards will be dynamically generated here -->
        </main>
    </div>

    <!-- Modal for project details -->
    <div class="modal" id="project-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div class="modal-header">
                <h2 id="modal-title"></h2>
            </div>
            <div class="modal-body">
                <div class="project-description">
                    <p id="modal-description"></p>
                </div>
                <div class="image-gallery" id="modal-gallery">
                    <!-- Gallery images will be inserted here -->
                </div>
                <div class="modal-actions">
                    <a href="#" id="visit-source" class="visit-btn" target="_blank" rel="noopener noreferrer">
                        Visit Source
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
